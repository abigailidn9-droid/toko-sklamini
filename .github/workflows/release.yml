name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/kasir
          tagName: ${{ github.ref_name }}
          releaseName: TOKO SKLAMINI ${{ github.ref_name }}
          releaseBody: |
            Kasir Windows.

            Harga di keranjang tidak bisa diubah. Pasang sebagai update. Backup dulu.
          releaseDraft: false
          prerelease: false
