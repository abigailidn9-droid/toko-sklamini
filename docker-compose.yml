services:
  postgres:
    image: postgres:16-alpine
    container_name: sklamini-pg
    environment:
      POSTGRES_DB: sklamini
      POSTGRES_USER: sklamini
      POSTGRES_PASSWORD: sklamini
    ports:
      - "5432:5432"
    volumes:
      - sklamini_pg:/var/lib/postgresql/data

volumes:
  sklamini_pg:
